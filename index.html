<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eddie's Couch 2: Meet the Father</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Zach promised his girlfriend's dad he'd show him Eddie's Couch. The game no longer exists. The dad does not accept this.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
:root {
  /* Layout: a wood-grain console TV on living-room paneling. The game plays on its screen; all text rides on the glass. */
  --paneling: #2a1a11;
  --paneling-seam: #1d1109;
  --cabinet: #6f4526;
  --cabinet-hi: #8b5a33;
  --cabinet-lo: #3d2412;
  --bezel: #141012;
  --glass: #050407;
  --cream: #f4e7c9;
  --muted: #c4ab88;
  --ink: #1d1519;
  --paper: #f3ebd9;
  --dvr: #ff2b2b;
  --zach: #46bdb6;
  --alex: #efc96a;
  --dad: #d9707b;
  --beast: #ff4a3d;
  --brass: #e2b84a;
  --font-display: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Pixelify Sans", "Trebuchet MS", Verdana, sans-serif;
  --font-script: "Courier Prime", "Courier New", Courier, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    repeating-linear-gradient(90deg, transparent 0 58px, var(--paneling-seam) 58px 61px, rgba(255, 255, 255, .02) 61px 64px),
    radial-gradient(120% 80% at 50% 20%, #3a2417, var(--paneling) 70%);
  background-color: var(--paneling);
  color: var(--cream);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ---------- the TV ---------- */
.tv {
  position: relative;
  padding: 14px 14px 0;
  border-radius: 26px;
  background:
    repeating-linear-gradient(91deg, transparent 0 7px, rgba(0, 0, 0, .13) 7px 9px, transparent 9px 15px, rgba(255, 255, 255, .035) 15px 19px),
    linear-gradient(180deg, #7c4e2b, var(--cabinet) 35%, #5a361c);
  box-shadow: inset 0 2px 0 var(--cabinet-hi), inset 0 -3px 0 var(--cabinet-lo), 0 0 0 1px #24130a, 0 30px 50px -18px rgba(0, 0, 0, .8);
}
.bezel {
  padding: 10px;
  border-radius: 18px;
  background: linear-gradient(#211b1d, var(--bezel));
  box-shadow: inset 0 0 0 2px #2c2427, inset 0 8px 16px rgba(0, 0, 0, .6);
}
.screen {
  position: relative;
  width: 640px;
  height: 360px;
  overflow: hidden;
  border-radius: 16px / 13px;
  background: var(--glass);
  container-type: inline-size;
  outline: none;
}
.screen canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  outline: none;
}
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .07) 0 1px, transparent 1px 3px),
    radial-gradient(130% 100% at 50% 50%, transparent 66%, rgba(0, 0, 0, .38));
  box-shadow: inset 0 0 32px rgba(0, 0, 0, .45);
}
.tv-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 4px 11px;
}
.grille {
  flex: 1 1 auto;
  max-width: 220px;
  height: 22px;
  border-radius: 6px;
  background: repeating-linear-gradient(90deg, #24150b 0 3px, #4c2e18 3px 6px);
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, .6);
}
.plate {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 9px;
  border-radius: 5px;
  background: linear-gradient(#cdb37a, #8f7440);
  color: #2b1c0c;
  font: 700 11px/1 var(--font-ui);
  letter-spacing: .14em;
  text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 1px 0 rgba(0, 0, 0, .4);
  white-space: nowrap;
}
.rec {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #5a1414;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, .6);
  transition: background .2s, box-shadow .2s;
}
.rec.on {
  background: var(--dvr);
  box-shadow: 0 0 6px 2px rgba(255, 43, 43, .75), 0 0 16px 4px rgba(255, 43, 43, .35);
}
.knobs { display: flex; gap: 6px; }
.knob {
  appearance: none;
  border: 0;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 6px;
  background: linear-gradient(#3a3134, #1d1719);
  color: var(--muted);
  font: 500 12px/1 var(--font-ui);
  letter-spacing: .06em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 2px 0 #0c0809;
}
.knob:hover { color: var(--cream); }
.knob:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.knob:focus-visible, .touch button:focus-visible, .panel button:focus-visible, .skip:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.knob[aria-pressed="false"] { color: #7d6a5b; text-decoration: line-through; }

/* ---------- text that rides on the glass ---------- */
.ov {
  position: absolute;
  z-index: 6;
  box-sizing: border-box;
  font-size: 13px;
  font-size: clamp(11px, 2.35cqw, 21px);
  line-height: 1.3;
}
.dialog {
  left: 3%;
  right: 3%;
  bottom: 4%;
  display: flex;
  gap: .85em;
  align-items: flex-start;
  min-height: 3.9em;
  padding: .95em 1.1em .75em;
  background: rgba(22, 15, 19, .93);
  color: var(--cream);
  border: .16em solid var(--who, var(--cream));
  border-radius: .45em;
  box-shadow: 0 .3em 0 rgba(0, 0, 0, .45);
}
.dialog .who {
  position: absolute;
  top: -.95em;
  left: .8em;
  padding: .2em .6em .15em;
  border-radius: .3em;
  background: var(--who, var(--cream));
  color: var(--ink);
  font: 400 .78em/1.1 var(--font-display);
  letter-spacing: .05em;
}
.dialog .text { flex: 1 1 auto; min-width: 0; }
.dialog .line { margin: 0; font-size: 1.06em; }
.dialog .portrait {
  flex: none;
  width: 3.4em;
  height: 3.4em;
  margin-top: -.1em;
  border-radius: .35em;
  background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03));
  box-shadow: inset 0 0 0 .12em var(--who, var(--cream));
  image-rendering: pixelated;
}
.dialog.muffled .line { opacity: .72; font-style: italic; }
.dialog .line i { font-style: italic; color: #fff; }
.dialog .rest { visibility: hidden; }
.dialog[data-who="zach"] { --who: var(--zach); }
.dialog[data-who="alex"] { --who: var(--alex); }
.dialog[data-who="mom"] { --who: #f2a3b8; }
.dialog[data-who="dad"] { --who: var(--dad); }
.dialog[data-who="phone"] { --who: #8fd16a; }
.dialog[data-who="beast"] { --who: var(--beast); }
.dialog.loud .line { font: 400 1.5em/1.15 var(--font-display); color: var(--beast); letter-spacing: .03em; }
.dialog.loud { animation: rumble .12s steps(2) infinite; }
.dialog.loud .portrait { animation: rumble .1s steps(2) infinite; }
.hud {
  top: 3.5%;
  right: 3%;
  display: flex;
  gap: .7em;
  align-items: center;
  padding: .3em .6em;
  border-radius: .4em;
  background: rgba(22, 15, 19, .7);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.hud span { display: inline-flex; align-items: center; gap: .3em; }
.hud svg { width: 1.05em; height: 1.05em; }
.hud .off { opacity: .28; }
.hud .pulse { animation: hudpop .45s ease-out; }
.bubble {
  transform: translate(-50%, -100%);
  padding: .2em .5em .15em;
  border-radius: .45em;
  background: #fff;
  color: var(--ink);
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 .18em 0 rgba(0, 0, 0, .35);
}
.bubble.pop { animation: bubblepop .18s ease-out; }
.tutorial {
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: 86%;
  padding: .8em 1.1em;
  text-align: center;
  background: rgba(22, 15, 19, .9);
  border: .14em solid var(--cream);
  border-radius: .5em;
  box-shadow: 0 .3em 0 rgba(0, 0, 0, .45);
}
.tutorial p { margin: 0; font-size: 1.2em; }
.tutorial .aside { margin-top: .35em; font-family: var(--font-script); font-style: italic; font-size: 1em; color: var(--muted); }
.tutorial .hint { margin-top: .55em; font-size: .82em; color: var(--muted); }
.btn-glyph {
  display: inline-grid;
  place-items: center;
  min-width: 1.6em;
  height: 1.6em;
  padding: 0 .25em;
  margin: 0 .12em;
  border-radius: 50%;
  font: 400 .85em/1 var(--font-display);
  color: var(--ink);
  vertical-align: .05em;
  box-shadow: 0 .14em 0 rgba(0, 0, 0, .5);
}
.btn-glyph.a { background: #ff6b5b; }
.btn-glyph.b { background: #ffd23e; }
kbd {
  display: inline-block;
  min-width: 1.4em;
  padding: .12em .4em;
  border-radius: .3em;
  background: #3a3134;
  color: var(--cream);
  font: 500 .85em/1.2 var(--font-ui);
  text-align: center;
  box-shadow: 0 .12em 0 #0c0809;
}
.prompt {
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 90%;
  text-align: center;
  font: 400 1.35em/1.2 var(--font-display);
  color: var(--cream);
  text-shadow: .1em .1em 0 var(--ink), 0 0 .6em rgba(255, 43, 43, .5);
  letter-spacing: .06em;
  pointer-events: none;
}
.prompt small { display: block; margin-top: .45em; font: 400 .55em/1.3 var(--font-ui); letter-spacing: .04em; color: var(--paper); text-shadow: .1em .1em 0 var(--ink); }
.prompt.blink { animation: blink 1.1s steps(2) infinite; }
.panel {
  inset: 0;
  display: grid;
  place-items: center;
  padding: 4%;
  background: rgba(8, 5, 7, .58);
}
.panel .card {
  width: min(32em, 100%);
  max-height: 100%;
  overflow: auto;
  box-sizing: border-box;
  padding: 1em 1.2em 1.1em;
  border-radius: .55em;
  background: rgba(24, 16, 20, .96);
  border: .16em solid var(--cream);
  box-shadow: 0 .35em 0 rgba(0, 0, 0, .5);
  text-align: center;
}
.panel h2 { margin: 0 0 .25em; font: 400 1.75em/1.05 var(--font-display); color: var(--cream); text-wrap: balance; letter-spacing: .02em; }
.panel h2.red { color: var(--beast); }
.panel .body { color: var(--paper); }
.panel .body p { margin: .3em 0; }
.panel .quote { font-family: var(--font-script); font-style: italic; color: var(--muted); }
.panel .tally { color: var(--muted); font-size: .9em; letter-spacing: .04em; }
.panel dl { display: grid; grid-template-columns: auto auto; gap: .2em 1em; justify-content: center; margin: .5em 0 .2em; text-align: left; font-variant-numeric: tabular-nums; }
.panel dt { color: var(--muted); }
.panel dd { margin: 0; color: var(--cream); }
.panel .actions { display: flex; flex-wrap: wrap; gap: .5em; justify-content: center; margin-top: .8em; }
.panel button, .skip {
  appearance: none;
  border: 0;
  cursor: pointer;
  padding: .5em .9em .45em;
  border-radius: .35em;
  background: #3a3134;
  color: var(--cream);
  font: 500 1em/1.1 var(--font-ui);
  box-shadow: 0 .16em 0 #0c0809;
}
.panel button.primary { background: var(--brass); color: var(--ink); font-weight: 700; }
.panel button:active, .skip:active { transform: translateY(1px); box-shadow: none; }
.skip { top: 46%; right: 2.5%; padding: .35em .7em .3em; font-size: .85em; background: rgba(22, 15, 19, .75); color: var(--muted); }
.skip:hover { color: var(--cream); }

@keyframes nudge { 50% { transform: translateY(.18em); } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes rumble { 50% { transform: translate(.08em, -.06em); } }
@keyframes hudpop { 0% { transform: scale(1); } 35% { transform: scale(1.45); } 100% { transform: scale(1); } }
@keyframes bubblepop { from { transform: translate(-50%, -80%) scale(.6); } to { transform: translate(-50%, -100%) scale(1); } }

/* ---------- below the TV ---------- */
.legend {
  margin: 0;
  max-width: 62em;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: .45em 1.1em;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
  text-align: center;
}
.legend span { white-space: nowrap; }
.touch {
  display: none;
  width: 100%;
  max-width: 760px;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
body.touch-ui .touch { display: flex; }
body.touch-ui .legend { display: none; }
.cluster { display: grid; gap: 10px; }
.dpad { grid-template-columns: repeat(2, 60px); grid-template-areas: "l r" "d d"; justify-items: center; }
.dpad [data-act="left"] { grid-area: l; }
.dpad [data-act="right"] { grid-area: r; }
.dpad [data-act="down"] { grid-area: d; }
.face { grid-template-columns: repeat(2, 60px); grid-template-areas: "a b" "j j"; justify-items: center; }
.face [data-act="a"] { grid-area: a; }
.face [data-act="b"] { grid-area: b; }
.face [data-act="jump"] { grid-area: j; width: 130px; border-radius: 30px; }
.touch button {
  appearance: none;
  border: 0;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 1px;
  background: linear-gradient(#3e3437, #231c1f);
  color: var(--cream);
  font: 400 18px/1 var(--font-display);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 4px 0 #0c0809;
  touch-action: none;
}
.touch button small { font: 500 10px/1 var(--font-ui); color: var(--muted); letter-spacing: .04em; }
.touch button.down { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 1px 0 #0c0809; }
.touch [data-act="a"] { background: linear-gradient(#ff7b6b, #c9473a); color: var(--ink); }
.touch [data-act="a"] small, .touch [data-act="b"] small { color: rgba(29, 21, 25, .75); }
.touch [data-act="b"] { background: linear-gradient(#ffe07a, #c99e1d); color: var(--ink); }
.touch [data-act="b"].latched { box-shadow: 0 0 0 3px var(--cream), 0 4px 0 #0c0809; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 560px) {
  body { gap: 10px; }
  .tv { padding: 8px 8px 0; border-radius: 16px; }
  .bezel { padding: 6px; border-radius: 12px; }
  .screen { border-radius: 10px / 8px; }
  .tv-foot { padding: 6px 2px 8px; gap: 8px; }
  .grille { display: none; }
  .knob { padding: 6px 8px; font-size: 11px; }
  .dialog { padding: .7em .8em .55em; min-height: 3.2em; gap: .6em; }
  .dialog .portrait { width: 2.7em; height: 2.7em; }
  .skip { font-size: .72em; }
}
@media (orientation: landscape) and (max-height: 540px) {
  body { padding-block: 6px; }
  .tv-foot { display: none; }
  .tv { padding: 8px; border-radius: 16px; }
  .bezel { padding: 6px; }
  body.touch-ui .touch {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(10px, env(safe-area-inset-bottom, 0px));
    max-width: none;
    box-sizing: border-box;
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  body.touch-ui .cluster { pointer-events: auto; opacity: .9; }
  .touch button { width: 54px; height: 54px; }
  .dpad, .face { grid-template-columns: repeat(2, 54px); }
  .face [data-act="jump"] { width: 118px; }
}
@media (prefers-reduced-motion: reduce) {
  .dialog.loud, .dialog.loud .portrait, .prompt.blink, .dialog .more, .bubble.pop, .hud .pulse { animation: none; }
}
</style>
</head>
<body>
<div class="tv" id="tv">
  <div class="bezel">
    <div class="screen" id="screen" tabindex="0" aria-label="Eddie's Couch 2 game screen">
      <canvas id="game" width="960" height="540" aria-hidden="true"></canvas>
      <div class="ov hud" id="hud" hidden>
        <span title="Eddie's Couch backups"><svg viewBox="0 0 10 10" aria-hidden="true"><path fill="#3f7fd9" d="M0 0h8l2 2v8H0z"/><path fill="#c9ced6" d="M2 0h5v3H2z"/><path fill="#1d1519" d="M5 .6h1.2v1.8H5z"/><path fill="#f3ebd9" d="M1.5 5h7v4.2h-7z"/></svg><b id="hud-disks">0/5</b></span>
        <span id="hud-key" class="off" title="Front door key"><svg viewBox="0 0 10 10" aria-hidden="true"><path fill="#e2b84a" d="M1 3h3v4H1zM4 4.3h5v1.4H4zM7 5.7h1v1.6H7zM5.4 5.7h1v1.2h-1z"/><path fill="#1d1519" d="M2 4.3h1v1.4H2z"/></svg></span>
        <span id="hud-gift" class="off" title="The gift"><svg viewBox="0 0 10 10" aria-hidden="true"><path fill="#d8433a" d="M1 4h8v6H1z"/><path fill="#e2b84a" d="M4.3 4h1.4v6H4.3zM0 3h10v1.6H0zM2 1l3 2 3-2v2H2z"/></svg></span>
        <b id="hud-time">0:00</b>
      </div>
      <div class="ov bubble" id="bubble-zach" hidden></div>
      <div class="ov tutorial" id="tutorial" hidden></div>
      <div class="ov dialog" id="dialog" hidden><canvas class="portrait" width="64" height="64" aria-hidden="true" hidden></canvas><div class="text"><b class="who"></b><p class="line"></p></div><i class="more" aria-hidden="true">▼</i></div>
      <div class="ov prompt" id="prompt" hidden></div>
      <div class="ov panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title"><div class="card"><h2 id="panel-title"></h2><div class="body"></div><div class="actions"></div></div></div>
      <button class="ov skip" id="skip" type="button" hidden>Skip ▸▸</button>
      <div class="sr" id="sr" aria-live="polite"></div>
    </div>
  </div>
  <div class="tv-foot">
    <div class="grille" aria-hidden="true"></div>
    <div class="plate" title="Lights up when he's in the room"><span class="rec" id="rec"></span>DVR&nbsp;REC</div>
    <div class="knobs">
      <button class="knob" id="btn-sound" type="button" aria-pressed="true">Sound</button>
      <button class="knob" id="btn-pause" type="button">Pause</button>
      <button class="knob" id="btn-full" type="button">Full</button>
    </div>
  </div>
</div>
<div class="touch below" id="touch">
  <div class="cluster dpad">
    <button type="button" data-act="left" aria-label="Move left">◀</button>
    <button type="button" data-act="right" aria-label="Move right">▶</button>
    <button type="button" data-act="down" aria-label="Duck or slide">▼</button>
  </div>
  <div class="cluster face">
    <button type="button" data-act="a" aria-label="A: apologize">A<small>sorry</small></button>
    <button type="button" data-act="b" aria-label="B: run">B<small>run</small></button>
    <button type="button" data-act="jump" aria-label="Jump">JUMP</button>
  </div>
</div>
<p class="legend below" id="legend">
  <span><kbd>←</kbd> <kbd>→</kbd> move</span>
  <span><kbd>Space</kbd> or <kbd>↑</kbd> jump</span>
  <span><kbd>↓</kbd> duck · slide while running</span>
  <span><kbd>Z</kbd> <b class="btn-glyph a">A</b> apologize</span>
  <span>hold <kbd>X</kbd> or <kbd>Shift</kbd> <b class="btn-glyph b">B</b> run</span>
  <span><kbd>P</kbd> pause</span>
  <span><kbd>M</kbd> sound</span>
</p>
<script src="src/core.js"></script>
<script src="src/audio.js"></script>
<script src="src/art.js"></script>
<script src="src/scenes.js"></script>
<script src="src/fatalities.js"></script>
<script src="src/level.js"></script>
<script src="src/main.js"></script>
</body>
</html>
